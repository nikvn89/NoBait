name: NoBait source-backed checks
on: [push, pull_request, workflow_dispatch]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: genvm-universal-v0.2.16
      - name: Pin SDK release
        run: |
          mkdir -p ~/.cache/gltest-direct
          f=~/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz
          if [ ! -f "$f" ]; then curl -fsSL -o "$f" https://github.com/genlayerlabs/genvm/releases/download/v0.2.16/genvm-universal.tar.xz; fi
      - run: python3 -m genvm_linter.cli lint contracts/HeadlineBound.py
      - run: python3 -m pytest tests/contract/test_source_backed.py -q -p no:cacheprovider
      - run: python3 tests/mutation_check.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
